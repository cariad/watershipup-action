name: Publish with WatershipUp
description: >-
  Publishes a directory to a bunny.net storage zone with WatershipUp, and
  comments the report on a pull request.

inputs:
  directory:
    description: The directory to publish.
    required: true

  zone:
    description: The name of the storage zone to publish to.
    required: true

  password:
    description: >-
      The storage zone's read-write password, or its read-only password for a
      dry run. Pass it from a secret.
    required: true

  dry-run:
    description: >-
      `true` to only show what a publish would upload and delete, without
      changing the zone. Defaults to `false`.
    required: false
    default: "false"

  pull-request:
    description: >-
      The number of the pull request to comment the report on, or `merged` for
      the pull request that was merged to make the workflow's commit. Empty to
      not comment. Defaults to the workflow's pull request.
    required: false
    default: ${{ github.event.pull_request.number }}

runs:
  using: composite
  steps:
    - name: Set up Python
      id: python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ">=3.14"
        update-environment: false

    - name: Publish the directory
      id: publish
      shell: bash
      env:
        DIRECTORY: ${{ inputs.directory }}
        DRY_RUN: ${{ inputs.dry-run }}
        PYTHON: ${{ steps.python.outputs.python-path }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        WATERSHIPUP_PASSWORD: ${{ inputs.password }}
        ZONE: ${{ inputs.zone }}
      run: |
        # Anything but `true` or `false` is refused, so that a typo can't turn a dry
        # run into a publish.
        case $DRY_RUN in
          true)
            flags=(--dry-run)
            heading="Would publish to"
            ;;
          false)
            flags=()
            heading="Published to"
            ;;
          *)
            echo "::error::dry-run must be true or false."
            exit 1
            ;;
        esac

        if [[ -z $DIRECTORY ]]; then
          echo "::error::directory is required."
          exit 1
        fi

        # Make the path absolute:
        [[ $DIRECTORY == /* ]] || DIRECTORY=$PWD/$DIRECTORY

        venv=$(mktemp -d "$RUNNER_TEMP/watershipup-venv.XXXXXX")
        "$PYTHON" -I -m venv "$venv"

        [[ $RUNNER_OS == Windows ]] && bin=$venv/Scripts || bin=$venv/bin

        "$bin/pip" install --disable-pip-version-check --no-cache-dir --no-deps --only-binary :all: --quiet --require-hashes -r "$GITHUB_ACTION_PATH/requirements.txt"

        empty_dir=$(mktemp -d)
        cd "$empty_dir"

        report=$("$bin/watershipup" "${flags[@]}" --output=markdown --zone="$ZONE" -- "$DIRECTORY")
        echo "$report"

        title="## $heading \`$ZONE\`"
        printf '%s\n\n%s\n' "$title" "$report" > report.md

        # Prints the report, or its title and the note $2 when it's over $1 bytes.
        fit() {
          if (( $(wc -c < report.md) > $1 )); then
            printf '%s\n\n%s\n' "$title" "$2"
          else
            cat report.md
          fi
        }

        fit 1048576 "The report is too long for the job summary. See the log." >> "$GITHUB_STEP_SUMMARY"
        fit 65536 "The report is too long for a comment. See the [workflow run]($RUN_URL)." > comment.md
        echo "comment=$PWD/comment.md" >> "$GITHUB_OUTPUT"

    - name: Comment on the pull request
      if: ${{ always() && inputs.pull-request }}
      continue-on-error: true
      shell: bash
      env:
        COMMENT: ${{ steps.publish.outputs.comment }}
        GH_TOKEN: ${{ github.token }}
        PULL_REQUEST: ${{ inputs.pull-request }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        ZONE: ${{ inputs.zone }}
      run: |
        export GH_HOST=${GITHUB_SERVER_URL#*://}

        # Only the latest pull request merged into the pushed branch of this
        # repository, so that an open one whose branch has the commit, or one
        # that merged the same commit into another branch, isn't picked.
        if [[ $PULL_REQUEST == merged ]]; then
          # Only a push, so that a rerun at the commit by any other event, like a
          # `workflow_dispatch`, doesn't comment the pull request again.
          if [[ $GITHUB_EVENT_NAME != push ]]; then
            echo "::notice::The workflow ran on $GITHUB_EVENT_NAME, not a push, so there's no merged pull request to comment on."
            exit 0
          fi

          PULL_REQUEST=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '[.[] | select(.merged_at and .base.ref == env.GITHUB_REF_NAME and .base.repo.full_name == env.GITHUB_REPOSITORY)] | sort_by(.merged_at) | last.number // empty')

          if [[ -z $PULL_REQUEST ]]; then
            echo "::notice::No merged pull request made $GITHUB_SHA, so there's nothing to comment on."
            exit 0
          fi
        fi

        {
          if [[ -z $COMMENT ]]; then
            echo "## WatershipUp didn't finish for \`$ZONE\`"
            echo
            echo "See the [workflow run]($RUN_URL)."
          else
            cat "$COMMENT"
          fi
        } | gh pr comment "$PULL_REQUEST" --repo "$GITHUB_REPOSITORY" --body-file -
